name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Root quality gate (21 projects)
        shell: bash
        run: python quality_gate.py --json > quality-report.json

      - name: Check undefined names
        run: python -m ruff check --select F821,F822,F823 .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report-${{ matrix.os }}
          path: quality-report.json

      - name: Check dependency consistency
        run: python -m pip check
